[project]
name = "check-bag"
version = "0.1.0"
description = "Check the validity of ROS1 and ROS2 bags"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rosbags>=0.10",
    "tqdm>=4.66",
]

[project.scripts]
check_bag = "check_bag.cli:main"
decompress_bag = "check_bag.decompress:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/check_bag"]
